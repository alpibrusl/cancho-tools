name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      # The compiler is whichever commit cancho.toml says these sources were
      # written for: one place, which the compiler itself checks.
      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f]*\)".*/\1/p' tools/cancho.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ steps.pin.outputs.rev }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/cancho/target/release" >> "$GITHUB_PATH"

      - name: What the gates compare against (jq, strace, ripgrep) and validate with (jsonschema)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq strace ripgrep
          pip install jsonschema

      - name: Formatting
        working-directory: tools
        run: cancho fmt --check contract tools tests generated server

      - name: Build every tool
        working-directory: tools
        run: cancho build

      - name: Unit tests of the contract package
        working-directory: tools
        run: cancho test

      - name: Schemas are generated, not edited
        working-directory: tools
        run: python3 scripts/schemas.py --check

      - name: M6 -- the authority is the compiler's, embedded, within its ceiling
        working-directory: tools
        run: python3 scripts/manifest.py --check

      - name: Two agents, one file -- the lost update and its refusal, and README.md is current
        working-directory: tools
        run: python3 scripts/demo_race.py --check

      - name: The published contract package matches contract/ (docs/next-tools.md section 5)
        working-directory: tools
        run: python3 scripts/package.py --check

      - name: The MCP server's tool definitions are generated from introspect (docs/mcp.md)
        working-directory: tools
        run: python3 scripts/mcp.py --check

      - name: The Pages site generates from these binaries
        working-directory: tools
        run: python3 scripts/site.py --out "$RUNNER_TEMP/site"

      - name: M1-M9 and D14 -- the offline gates
        working-directory: tools
        run: python3 -W ignore -m unittest discover -s tests/conformance -v

  # The benchmark harness's own self-test (S3): power and the /dev/null
  # pitfall. It reports a probe and gates nothing against GNU; it is a
  # separate job because a shared runner is noisy.
  toolbench-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: python3 scripts/toolbench.py --self-test
