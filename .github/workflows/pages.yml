name: pages

# The site is generated from the tools a build produces (scripts/site.py reads
# each tool's `introspect`), so it is rebuilt from main on every push and can
# never describe a binary that does not exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - name: Read the compiler pin from lex-sys.toml
        id: pin
        run: echo "rev=$(sed -n 's/^lex-sys *= *"\([0-9a-f]*\)".*/\1/p' tools/lex-sys.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ steps.pin.outputs.rev }}
          path: lex-sys

      # The same key as ci.yml, so a pin CI has built is not built again.
      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ steps.pin.outputs.rev }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: Put the compiler on PATH
        run: echo "$GITHUB_WORKSPACE/lex-sys/target/release" >> "$GITHUB_PATH"

      - name: Build every tool
        working-directory: tools
        run: lex-sys build

      - name: Generate the site
        working-directory: tools
        run: python3 scripts/site.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
