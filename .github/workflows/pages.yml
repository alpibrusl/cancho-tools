name: pages

# The site is generated from the tools a build produces (scripts/site.py reads
# each tool's `introspect`), so it is rebuilt from main on every push and can
# never describe a binary that does not exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - name: Read the compiler pin from cancho.toml
        id: pin
        run: echo "rev=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' tools/cancho.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned compiler
        run: |
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "${{ steps.pin.outputs.rev }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build every tool
        working-directory: tools
        run: cancho build

      - name: Generate the site
        working-directory: tools
        run: python3 scripts/site.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
