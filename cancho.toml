[package]
name = "cancho-tools"
cancho = "a4572ea3b506e4bcec1c4be43deda1043c11ba9f"   # the compiler these sources were written for

# One program per tool (D17): a program's authority is the union of what its
# main reaches, so a multi-call binary would report every tool's row for every
# invocation. `contract` is the shared package; `generated/<tool>` is the
# manifest the build embeds (D12, scripts/manifest.py).

[[bin]]
name = "seek"
sources = ["contract", "tools/seek", "generated/seek"]
std = true
out = "build/seek"

[[bin]]
name = "write"
sources = ["contract", "tools/write", "generated/write"]
std = true
out = "build/write"

[[bin]]
name = "replace"
sources = ["contract", "tools/replace", "generated/replace"]
std = true
out = "build/replace"

