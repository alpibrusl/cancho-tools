std = true
out = "build/peek"

[[bin]]
name = "jsonq"
sources = ["contract", "tools/jsonq", "generated/jsonq"]
std = true
out = "build/jsonq"

[[bin]]
name = "tally"
sources = ["contract", "tools/tally", "generated/tally"]
std = true
out = "build/tally"

[[bin]]
name = "hash"
