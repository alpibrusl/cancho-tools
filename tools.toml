# The authority ceiling of each tool (lex-sys docs/agent-toolbox.md D12).
#
# This file is what a person writes and reviews. It is a *ceiling*, never the
# authority: the authority is whatever `lex-sys authority` derives from the
# source (manifests/<tool>.authority.json, embedded in the binary and printed by
# `<tool> introspect`), and scripts/manifest.py --check fails when a derived
# label is not allowed here. Widening a tool is therefore an edit to this file:
# a reviewable diff. Rows are exact in both directions, so the derived set may
# be smaller than the ceiling, never larger.
#
# A label with an argument is written as the compiler prints it: fs_read("").
# No tool may hold ffi, net_out, net_in or clock; `bounded` must be true.

# D1: at most ten tools. A new [tool] past this count fails the check.
max_tools = 10

[seek]
allow = ["args", "err_write", "file_read", "fs_read(\"\")", "heap", "io_write"]

[write]
allow = ["args", "err_write", "file_read", "file_write", "fs_read(\"\")", "fs_write(\"\")", "heap", "io_read", "io_write"]

[replace]
allow = ["args", "err_write", "file_read", "file_write", "fs_read(\"\")", "fs_write(\"\")", "heap", "io_write"]

[peek]
allow = ["args", "err_write", "file_read", "fs_read(\"\")", "heap", "io_write"]

[jsonq]
allow = ["args", "err_write", "file_read", "fs_read(\"\")", "heap", "io_read", "io_write"]

[tally]
allow = ["args", "err_write", "file_read", "fs_read(\"\")", "heap", "io_read", "io_write"]

[hash]
allow = ["args", "err_write", "file_read", "fs_read(\"\")", "heap", "io_write"]
